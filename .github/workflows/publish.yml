name: Publish catalog index

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-catalog
  cancel-in-progress: false

permissions:
  contents: write

env:
  PYTHONUTF8: "1"

jobs:
  publish:
    name: Build immutable catalog snapshot
    if: >-
      github.event_name == 'workflow_dispatch' ||
      !startsWith(github.event.head_commit.message, 'chore(catalog): publish index')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out database content commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check out tested Luminesk CLI
        uses: actions/checkout@v7
        with:
          repository: task-v1/luminesk-cli
          # Keep this immutable revision synchronized with validate.yml.
          ref: "13d378f9f542b7d3ec138fd01291d06bc69153bc"
          path: .ci/luminesk-cli
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: .ci/luminesk-cli/uv.lock

      - name: Install tested CLI development environment
        run: uv sync --project .ci/luminesk-cli --locked --extra dev

      - name: Validate source recipes
        run: .ci/luminesk-cli/.venv/bin/python -m tools.validate

      - name: Run compatibility tests
        run: .ci/luminesk-cli/.venv/bin/python -m pytest

      - name: Build catalog for exact content revision
        run: >-
          .ci/luminesk-cli/.venv/bin/python -m tools.build_index
          --revision "${GITHUB_SHA}"

      - name: Validate generated catalog artifacts
        run: >-
          .ci/luminesk-cli/.venv/bin/python -m tools.validate
          --check-dist

      - name: Commit published index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/index-v1.json dist/index-v1.json.sha256
          git diff --cached --quiet && exit 0
          git commit -m "chore(catalog): publish index for ${GITHUB_SHA}"
          git push origin HEAD:main
