manifest_version = 1
template = "template"

[package]
name = "dragonfly"
version = "1.0.0"
display_name = "Dragonfly"
kind = "core"
game = "minecraft"
edition = "bedrock"
summary = "High-performance Dragonfly server for Minecraft Bedrock Edition"
keywords = ["dragonfly", "df-mc", "bedrock", "go"]
license = "MIT"
authors = ["df-mc"]
platforms = ["linux/amd64", "linux/arm64"]

[package.repository]
url = "https://github.com/df-mc/dragonfly"

[inputs.server_name]
type = "string"
default = "Dragonfly Server"
pattern = '''^[^\r\n"\\]{1,64}$'''
prompt = "Server name"

[inputs.memory]
type = "string"
default = "2g"
pattern = "^[1-9][0-9]*[mMgG]$"
prompt = "Memory limit"

[inputs.runtime_uid]
type = "integer"
default = 1000
min = 1
max = 2147483647
prompt = "Host user ID for server files"

[inputs.runtime_gid]
type = "integer"
default = 1000
min = 1
max = 2147483647
prompt = "Host group ID for server files"

[build]
file = ".luminesk/Dockerfile"
output = "/out"
timeout = 1200
cpu = 2
memory = "4g"
network = true

[runtime]
image = "gcr.io/distroless/static-debian12:nonroot@sha256:afa5c872c891853ca7fcf1f12c3edb23f7eeef36189728842dd51042ff57f7ab"
command = ["./dragonfly"]
memory = "${input.memory}"
stop_signal = "SIGINT"
stop_timeout = 30
restart = "on-failure"
restart_limit = 3
run_as = "${input.runtime_uid}:${input.runtime_gid}"
read_only_root = true

[[runtime.mounts]]
source = "."
target = "/server"
mode = "rw"

[[runtime.mounts]]
source = ".tmp"
target = "/tmp"
mode = "rw"

[[runtime.ports]]
name = "game"
host = 19132
container = 19132
protocol = "udp"

[[checks]]
id = "core-present"
phase = "post-build"
kind = "file"
path = "dragonfly"

[[checks]]
id = "ready"
phase = "readiness"
kind = "process-alive"
timeout = 30

[ownership]
preserve = ["config.toml"]
data = [".tmp", "players", "resources", "world"]
executable = ["dragonfly"]

[update]
backup = ["config.toml", "players", "resources", "world"]
retain_backups = 3
rollback_on_failure = true
