manifest_version = 1

[package]
name = "nukkit-mot"
version = "1.0.0"
display_name = "Nukkit-MOT"
kind = "core"
game = "minecraft"
edition = "bedrock"
summary = "Multi-version Nukkit-MOT server for Minecraft Bedrock Edition"
keywords = ["nukkit-mot", "nukkit", "bedrock", "java", "plugins"]
license = "LGPL-3.0-only"
authors = ["MemoriesOfTime"]
platforms = ["linux/amd64", "linux/arm64"]

[package.repository]
url = "https://github.com/MemoriesOfTime/Nukkit-MOT"

[inputs.memory]
type = "string"
default = "2g"
pattern = "^[1-9][0-9]*[mMgG]$"
prompt = "Memory limit"

[inputs.runtime_uid]
type = "integer"
default = 1000
min = 1
max = 2147483647
prompt = "Host user ID for server files"

[inputs.runtime_gid]
type = "integer"
default = 1000
min = 1
max = 2147483647
prompt = "Host group ID for server files"

[[sources]]
id = "core"
type = "jenkins"
target = "server.jar"
max_size = 268435456

[sources.options]
base_url = "https://motci.cn"
job = "Nukkit-MOT/job/master"
artifact = "Nukkit-MOT-SNAPSHOT.jar"
build = "lastSuccessfulBuild"

[runtime]
image = "eclipse-temurin:17-jre@sha256:13cc28a6cc72a38ce1f00c906be3580c1a3e604b8984d694f369a96742abc93b"
command = ["java", "-Xms${input.memory}", "-Xmx${input.memory}", "-jar", "server.jar", "--language", "eng"]
memory = "${input.memory}"
stop_signal = "SIGINT"
stop_timeout = 30
restart = "on-failure"
restart_limit = 3
run_as = "${input.runtime_uid}:${input.runtime_gid}"
read_only_root = true

[[runtime.mounts]]
source = "."
target = "/server"
mode = "rw"

[[runtime.mounts]]
source = ".tmp"
target = "/tmp"
mode = "rw"

[[runtime.ports]]
name = "game"
host = 19132
container = 19132
protocol = "udp"

[[checks]]
id = "core-present"
phase = "post-build"
kind = "file"
path = "server.jar"

[[checks]]
id = "ready"
phase = "readiness"
kind = "log-regex"
pattern = "Done .* For help, type"
timeout = 180

[ownership]
preserve = [
  "banned-ips.json",
  "banned-players.json",
  "nukkit.yml",
  "ops.txt",
  "server.properties",
  "white-list.txt",
]
data = [".tmp", "logs", "players", "plugins", "worlds"]

[update]
backup = [
  "banned-ips.json",
  "banned-players.json",
  "nukkit.yml",
  "ops.txt",
  "players",
  "plugins",
  "server.properties",
  "white-list.txt",
  "worlds",
]
retain_backups = 3
rollback_on_failure = true
